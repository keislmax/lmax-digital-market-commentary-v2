              const data = await fetchCoinalyze(`/ohlcv-history?symbols=${chunks[i].join(',')}&interval=1hour&from=${from24h}&to=${to}`);
              if (Array.isArray(data)) {
                for (const sym of data) {
                  for (const p of (sym.history||[])) {
                    totalVolume += (p.v||0) * (p.c||0);
                  }
                }
              }
              if (i < chunks.length-1) await sleep(1600);
              if (i % 5 === 4) console.log(`${i+1}/${chunks.length} chunks`);
            }
            console.log('totalVolume:', totalVolume);
            await writeRedis('coinalyze:volume', { totalVolume }, 7200);
          }
          main().catch(e => { console.error(e); process.exit(1); });
          EOF

  fetch-funding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Funding Rates
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');
          const COINALYZE_KEY = process.env.COINALYZE_API_KEY;
          const REDIS_URL = process.env.UPSTASH_REDIS_REST_URL;
          const REDIS_TOKEN = process.env.UPSTASH_REDIS_REST_TOKEN;
          function request(url, opts={}) {
            return new Promise((res) => {
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search,
                method: opts.method || 'GET',
                headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
              }, r => {
                let data = '';
                r.on('data', c => data += c);
                r.on('end', () => { try { res(JSON.parse(data)); } catch { res(null); } });
              });
              req.on('error', () => res(null));
              if (opts.body) req.write(opts.body);
              req.end();
            });
          }
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          async function fetchCoinalyze(path, retries=3) {
            for (let i = 0; i < retries; i++) {
              const data = await request(`https://api.coinalyze.net/v1${path}`, { headers: { 'api_key': COINALYZE_KEY } });
              if (data && !data.message) return data;
              const wait = data?.message ? 62 : 10;
              console.log(`Retry ${i+1}: ${path.split('?')[0]} (${wait}s)`);
              await sleep(wait * 1000);
            }
            return null;
          }
          async function writeRedis(key, value, ttl=7200) {
            const body = JSON.stringify([['SET', key, JSON.stringify(value), 'EX', String(ttl)]]);
            const r = await request(`${REDIS_URL}/pipeline`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${REDIS_TOKEN}`, 'Content-Type': 'application/json' },
              body
            });
            console.log('Redis:', JSON.stringify(r));
          }
          async function main() {
            const from24h = Math.floor(Date.now()/1000) - 86400;
            const to = Math.floor(Date.now()/1000);
            const SYMBOLS = [
              'BTCUSDT_PERP.A','BTCUSD_PERP.0','BTCUSDT_PERP.3','BTC-PERPETUAL.2','BTCUSDT_PERP.4','BTCPERP.6',
              'ETHUSDT_PERP.A','ETHUSD_PERP.0','ETHUSDT_PERP.3','ETH-PERPETUAL.2','ETHUSDT_PERP.4','ETHPERP.6',
              'SOLUSDT_PERP.A','SOLUSDT_PERP.3','SOLUSDT_PERP.4','SOLPERP.6',
              'XRPUSDT_PERP.A','XRPUSDT_PERP.3','XRPUSDT_PERP.4','XRPPERP.6',
            ].join(',');
            const [fundingCurrent, fundingHistory] = await Promise.all([
              fetchCoinalyze(`/funding-rate?symbols=${SYMBOLS}`),
              fetchCoinalyze(`/funding-rate-history?symbols=${SYMBOLS}&interval=1hour&from=${from24h}&to=${to}`),
            ]);
            const avgFunding = Array.isArray(fundingCurrent) && fundingCurrent.length
              ? fundingCurrent.reduce((s,f)=>s+(f.last_funding_rate||0),0)/fundingCurrent.length : 0;
            const byTime = {};
            for (const sym of (fundingHistory||[])) {
              for (const p of (sym.history||[])) {
                if (!byTime[p.t]) byTime[p.t] = [];
                byTime[p.t].push(p.o);
              }
            }
            const fundChart = Object.entries(byTime)
              .map(([t,vals])=>({t:+t,v:vals.reduce((a,b)=>a+b,0)/vals.length}))
              .sort((a,b)=>a.t-b.t);
            console.log('avgFunding:', avgFunding, 'chart points:', fundChart.length);
            await writeRedis('coinalyze:funding', { avgFunding, fundChart }, 7200);
          }
          main().catch(e => { console.error(e); process.exit(1); });
          EOF

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fetch-oi, fetch-oi-history, fetch-liqs, fetch-volume, fetch-funding]
    steps:
      - name: Assemble final result
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');
          const REDIS_URL = process.env.UPSTASH_REDIS_REST_URL;
          const REDIS_TOKEN = process.env.UPSTASH_REDIS_REST_TOKEN;

          function request(url, opts={}) {
            return new Promise((res) => {
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search,
                method: opts.method || 'GET',
                headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
              }, r => {
                let data = '';
                r.on('data', c => data += c);
                r.on('end', () => { try { res(JSON.parse(data)); } catch { res(null); } });
              });
              req.on('error', () => res(null));
              if (opts.body) req.write(opts.body);
              req.end();
            });
          }

          async function getRedis(key) {
            const r = await request(`${REDIS_URL}/get/${encodeURIComponent(key)}`, {
              headers: { 'Authorization': `Bearer ${REDIS_TOKEN}` }
            });
            if (r?.result) {
              try { return JSON.parse(r.result); } catch { return null; }
            }
            return null;
          }

          async function writeRedis(key, value, ttl=7200) {
            const body = JSON.stringify([['SET', key, JSON.stringify(value), 'EX', String(ttl)]]);
            const r = await request(`${REDIS_URL}/pipeline`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${REDIS_TOKEN}`, 'Content-Type': 'application/json' },
              body
            });
            console.log('Redis write:', JSON.stringify(r));
          }

          async function main() {
            const [oi, oihistory, liqs, volume, funding] = await Promise.all([
              getRedis('coinalyze:oi'),
              getRedis('coinalyze:oihistory'),
              getRedis('coinalyze:liqs'),
              getRedis('coinalyze:volume'),
              getRedis('coinalyze:funding'),
            ]);

            console.log('oi:', oi?.totalOI);
            console.log('oihistory points:', oihistory?.oiChart?.length);
            console.log('liqs:', liqs?.totalLiqs);
            console.log('volume:', volume?.totalVolume);
            console.log('funding:', funding?.avgFunding);

            const result = {
              totalOI: oi?.totalOI || 0,
              oiChange24h: oihistory?.oiChange24h || 0,
              oiChart: oihistory?.oiChart || [],
              totalLiqs: liqs?.totalLiqs || 0,
              totalLongLiqs: liqs?.totalLongLiqs || 0,
              totalShortLiqs: liqs?.totalShortLiqs || 0,
              liqChart: liqs?.liqChart || [],
              totalVolume: volume?.totalVolume || 0,
              avgFunding: funding?.avgFunding || 0,
              fundChart: funding?.fundChart || [],
              updatedAt: Date.now(),
            };

            await writeRedis('coinalyze:data', result, 7200);
            console.log('Final result assembled and written to Redis');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF
