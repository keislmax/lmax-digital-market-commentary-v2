name: Fetch Market Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-oi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch Open Interest
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');
          const COINALYZE_KEY = process.env.COINALYZE_API_KEY;
          const REDIS_URL = process.env.UPSTASH_REDIS_REST_URL;
          const REDIS_TOKEN = process.env.UPSTASH_REDIS_REST_TOKEN;

          function request(url, opts={}) {
            return new Promise((res) => {
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search,
                method: opts.method || 'GET',
                headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
              }, r => {
                let data = '';
                r.on('data', c => data += c);
                r.on('end', () => { try { res(JSON.parse(data)); } catch { res(null); } });
              });
              req.on('error', () => res(null));
              if (opts.body) req.write(opts.body);
              req.end();
            });
          }
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          function chunk(arr, size) {
            const out = [];
            for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i+size));
            return out;
          }
          async function fetchCoinalyze(path, retries=3) {
            for (let i = 0; i < retries; i++) {
              const data = await request(`https://api.coinalyze.net/v1${path}`, { headers: { 'api_key': COINALYZE_KEY } });
              if (data && !data.message) return data;
              const wait = data?.message ? 62 : 10;
              console.log(`Retry ${i+1}: ${path.split('?')[0]} (${wait}s)`);
              await sleep(wait * 1000);
            }
            return null;
          }
          async function writeRedis(key, value, ttl=7200) {
            const body = JSON.stringify([['SET', key, JSON.stringify(value), 'EX', String(ttl)]]);
            const r = await request(`${REDIS_URL}/pipeline`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${REDIS_TOKEN}`, 'Content-Type': 'application/json' },
              body
            });
            console.log('Redis:', JSON.stringify(r));
          }
          async function main() {
            const markets = await fetchCoinalyze('/future-markets');
            const allSymbols = markets.map(m => m.symbol);
            console.log('Symbols:', allSymbols.length);
            const chunks = chunk(allSymbols, 200);
            const results = [];
            for (let i = 0; i < chunks.length; i++) {
              const data = await fetchCoinalyze(`/open-interest?symbols=${chunks[i].join(',')}&convert_to_usd=true`);
              if (Array.isArray(data)) results.push(...data);
              if (i < chunks.length-1) await sleep(1600);
              if (i % 5 === 4) console.log(`${i+1}/${chunks.length} chunks`);
            }
            const totalOI = results.reduce((s,x) => s+(x.value||0), 0);
            console.log('totalOI:', totalOI);
            await writeRedis('coinalyze:oi', { totalOI }, 7200);
          }
          main().catch(e => { console.error(e); process.exit(1); });
          EOF

  fetch-oi-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch OI History
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');
          const COINALYZE_KEY = process.env.COINALYZE_API_KEY;
          const REDIS_URL = process.env.UPSTASH_REDIS_REST_URL;
          const REDIS_TOKEN = process.env.UPSTASH_REDIS_REST_TOKEN;
          function request(url, opts={}) {
            return new Promise((res) => {
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search,
                method: opts.method || 'GET',
                headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
              }, r => {
                let data = '';
                r.on('data', c => data += c);
                r.on('end', () => { try { res(JSON.parse(data)); } catch { res(null); } });
              });
              req.on('error', () => res(null));
              if (opts.body) req.write(opts.body);
              req.end();
            });
          }
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          function chunk(arr, size) {
            const out = [];
            for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i+size));
            return out;
          }
          async function fetchCoinalyze(path, retries=3) {
            for (let i = 0; i < retries; i++) {
              const data = await request(`https://api.coinalyze.net/v1${path}`, { headers: { 'api_key': COINALYZE_KEY } });
              if (data && !data.message) return data;
              const wait = data?.message ? 62 : 10;
              console.log(`Retry ${i+1}: ${path.split('?')[0]} (${wait}s)`);
              await sleep(wait * 1000);
            }
            return null;
          }
          async function writeRedis(key, value, ttl=7200) {
            const body = JSON.stringify([['SET', key, JSON.stringify(value), 'EX', String(ttl)]]);
            const r = await request(`${REDIS_URL}/pipeline`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${REDIS_TOKEN}`, 'Content-Type': 'application/json' },
              body
            });
            console.log('Redis:', JSON.stringify(r));
          }
          async function main() {
            const from24h = Math.floor(Date.now()/1000) - 86400;
            const to = Math.floor(Date.now()/1000);
            const markets = await fetchCoinalyze('/future-markets');
            const allSymbols = markets.map(m => m.symbol);
            const chunks = chunk(allSymbols, 200);
            const results = [];
            for (let i = 0; i < chunks.length; i++) {
              const data = await fetchCoinalyze(`/open-interest-history?symbols=${chunks[i].join(',')}&interval=1hour&from=${from24h}&to=${to}&convert_to_usd=true`);
              if (Array.isArray(data)) results.push(...data);
              if (i < chunks.length-1) await sleep(1600);
              if (i % 5 === 4) console.log(`${i+1}/${chunks.length} chunks`);
            }
            const byTime = {};
            for (const sym of results) {
              for (const p of (sym.history||[])) {
                byTime[p.t] = (byTime[p.t]||0) + p.c;
              }
            }
            const oiChart = Object.entries(byTime).map(([t,v])=>({t:+t,v})).sort((a,b)=>a.t-b.t);
            const oiChange24h = oiChart.length>=2 ? ((oiChart[oiChart.length-1].v - oiChart[0].v) / oiChart[0].v) * 100 : 0;
            console.log('oiChart points:', oiChart.length, 'change24h:', oiChange24h);
            await writeRedis('coinalyze:oihistory', { oiChart, oiChange24h }, 7200);
          }
          main().catch(e => { console.error(e); process.exit(1); });
          EOF

