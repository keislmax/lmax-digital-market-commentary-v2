name: Fetch Market Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch and cache market data
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');

          const COINALYZE_KEY = process.env.COINALYZE_API_KEY;
          const REDIS_URL = process.env.UPSTASH_REDIS_REST_URL;
          const REDIS_TOKEN = process.env.UPSTASH_REDIS_REST_TOKEN;

          function request(url, opts={}) {
            return new Promise((res) => {
              const u = new URL(url);
              const options = {
                hostname: u.hostname,
                path: u.pathname + u.search,
                method: opts.method || 'GET',
                headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
              };
              const req = https.request(options, r => {
                let data = '';
                r.on('data', c => data += c);
                r.on('end', () => { try { res(JSON.parse(data)); } catch { res(null); } });
              });
              req.on('error', e => { console.log('Request error:', e.message); res(null); });
              if (opts.body) req.write(opts.body);
              req.end();
            });
          }

          function nowSec() { return Math.floor(Date.now()/1000); }
          function ago(s) { return nowSec()-s; }
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          function chunk(arr, size) {
            const out = [];
            for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i+size));
            return out;
          }

          async function fetchCoinalyze(path, retries=3) {
            for (let i = 0; i < retries; i++) {
              const data = await request(`https://api.coinalyze.net/v1${path}`, {
                headers: { 'api_key': COINALYZE_KEY }
              });
              if (data && !data.message) return data;
              const wait = data?.message ? 62 : 10;
              console.log(`  Retry ${i+1} for ${path.split('?')[0]} (${data?.message||'error'}) waiting ${wait}s`);
              await sleep(wait * 1000);
            }
            return null;
          }

          // Fetch all chunks for one endpoint sequentially, respecting rate limits
          async function fetchAllChunks(endpoint, chunks, extraParams) {
            const results = [];
            for (let i = 0; i < chunks.length; i++) {
              const symbols = chunks[i].join(',');
              const data = await fetchCoinalyze(`/${endpoint}?symbols=${symbols}&${extraParams}`);
              if (Array.isArray(data)) results.push(...data);
              // Stay under 40 calls/min — sleep 1.6s between calls
              if (i < chunks.length - 1) await sleep(1600);
              if (i % 10 === 9) console.log(`  ${endpoint}: ${i+1}/${chunks.length} chunks done`);
            }
            return results;
          }

          async function writeRedis(key, value, ttl=7200) {
            const valueStr = JSON.stringify(value);
            console.log(`Writing to Redis: ${key} (${valueStr.length} bytes)`);
            const body = JSON.stringify([['SET', key, valueStr, 'EX', String(ttl)]]);
            const result = await request(`${REDIS_URL}/pipeline`, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${REDIS_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body
            });
            console.log('Redis result:', JSON.stringify(result));
            return result;
          }

          async function main() {
            const from24h = ago(86400);
            const to = nowSec();

            // Step 1: Get all symbols
            console.log('Fetching all symbols...');
            const markets = await fetchCoinalyze('/future-markets');
            if (!Array.isArray(markets)) {
              console.error('Failed to fetch markets');
              process.exit(1);
            }
            const allSymbols = markets.map(m => m.symbol);
            console.log(`Total symbols: ${allSymbols.length}`);
            const chunks = chunk(allSymbols, 200);
            console.log(`Total chunks: ${chunks.length}`);

            await sleep(2000);

            // Step 2: Fetch each endpoint
            console.log('\n--- Fetching open interest ---');
            const oiCurrent = await fetchAllChunks('open-interest', chunks, 'convert_to_usd=true');
            console.log(`OI results: ${oiCurrent.length} symbols`);

            await sleep(3000);

            console.log('\n--- Fetching OI history ---');
            const oiHistory = await fetchAllChunks('open-interest-history', chunks, `interval=1hour&from=${from24h}&to=${to}&convert_to_usd=true`);
            console.log(`OI history results: ${oiHistory.length} symbols`);

            await sleep(3000);

            console.log('\n--- Fetching liquidation history ---');
            const liqHistory = await fetchAllChunks('liquidation-history', chunks, `interval=1hour&from=${from24h}&to=${to}&convert_to_usd=true`);
            console.log(`Liq history results: ${liqHistory.length} symbols`);

            await sleep(3000);

            console.log('\n--- Fetching OHLCV history (volume) ---');
            const volHistory = await fetchAllChunks('ohlcv-history', chunks, `interval=1hour&from=${from24h}&to=${to}`);
            console.log(`Volume history results: ${volHistory.length} symbols`);

            await sleep(3000);

            // Funding rate — BTC/ETH/SOL/XRP only (per spec)
            const FUNDING_SYMBOLS = [
              'BTCUSDT_PERP.A','BTCUSD_PERP.0','BTCUSDT_PERP.3','BTC-PERPETUAL.2','BTCUSDT_PERP.4','BTCPERP.6',
              'ETHUSDT_PERP.A','ETHUSD_PERP.0','ETHUSDT_PERP.3','ETH-PERPETUAL.2','ETHUSDT_PERP.4','ETHPERP.6',
              'SOLUSDT_PERP.A','SOLUSDT_PERP.3','SOLUSDT_PERP.4','SOLPERP.6',
              'XRPUSDT_PERP.A','XRPUSDT_PERP.3','XRPUSDT_PERP.4','XRPPERP.6',
            ].join(',');

            console.log('\n--- Fetching funding rates ---');
            const fundingCurrent = await fetchCoinalyze(`/funding-rate?symbols=${FUNDING_SYMBOLS}`);
            await sleep(2000);
            const fundingHistory = await fetchCoinalyze(`/funding-rate-history?symbols=${FUNDING_SYMBOLS}&interval=1hour&from=${from24h}&to=${to}`);
            console.log(`Funding current: ${fundingCurrent?.length} symbols`);

            // Step 3: Aggregate
            console.log('\n--- Aggregating ---');

            // Total OI
            const totalOI = oiCurrent.reduce((s,x) => s+(x.value||0), 0);
            console.log('totalOI:', totalOI);

            // OI chart
            const oiByTime = {};
            for (const sym of oiHistory) {
              for (const p of (sym.history||[])) {
                oiByTime[p.t] = (oiByTime[p.t]||0) + p.c;
              }
            }
            const oiChart = Object.entries(oiByTime).map(([t,v])=>({t:+t,v})).sort((a,b)=>a.t-b.t);
            const oiChange24h = oiChart.length>=2
              ? ((oiChart[oiChart.length-1].v - oiChart[0].v) / oiChart[0].v) * 100 : 0;

            // Liquidations
            const liqByTime = {};
            for (const sym of liqHistory) {
              for (const p of (sym.history||[])) {
                if (!liqByTime[p.t]) liqByTime[p.t] = {l:0,s:0};
                liqByTime[p.t].l += p.l||0;
                liqByTime[p.t].s += p.s||0;
              }
            }
            const liqChart = Object.entries(liqByTime).map(([t,v])=>({t:+t,...v})).sort((a,b)=>a.t-b.t);
            const totalLiqs = liqChart.reduce((s,p)=>s+p.l+p.s, 0);
            const totalLongLiqs = liqChart.reduce((s,p)=>s+p.l, 0);
            const totalShortLiqs = liqChart.reduce((s,p)=>s+p.s, 0);
            console.log('totalLiqs:', totalLiqs);

            // Volume
            const volByTime = {};
            for (const sym of volHistory) {
              for (const p of (sym.history||[])) {
                volByTime[p.t] = (volByTime[p.t]||0) + (p.v||0) * (p.c||0);
              }
            }
            const totalVolume = Object.values(volByTime).reduce((a,b)=>a+b, 0);
            console.log('totalVolume:', totalVolume);

            // Funding
            const fundByTime = {};
            for (const sym of (fundingHistory||[])) {
              for (const p of (sym.history||[])) {
                if (!fundByTime[p.t]) fundByTime[p.t] = [];
                fundByTime[p.t].push(p.o);
              }
            }
            const fundChart = Object.entries(fundByTime)
              .map(([t,vals])=>({t:+t,v:vals.reduce((a,b)=>a+b,0)/vals.length}))
              .sort((a,b)=>a.t-b.t);
            const avgFunding = Array.isArray(fundingCurrent) && fundingCurrent.length
              ? fundingCurrent.reduce((s,f)=>s+(f.last_funding_rate||0),0)/fundingCurrent.length : 0;
            console.log('avgFunding:', avgFunding);

            const result = {
              totalOI, oiChange24h, oiChart,
              totalLiqs, totalLongLiqs, totalShortLiqs, liqChart,
              totalVolume,
              avgFunding, fundChart,
              updatedAt: Date.now(),
            };

            await writeRedis('coinalyze:data', result, 7200);
            console.log('\n--- Done! ---');
          }

          main().catch(e => { console.error('Fatal:', e); process.exit(1); });
          EOF
