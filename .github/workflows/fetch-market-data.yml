name: Fetch Market Data

on:
  schedule:
    - cron: '7 23,0,1,2,3,4,5,6,7 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch and cache market data
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');
          const COINALYZE_KEY = process.env.COINALYZE_API_KEY;
          const REDIS_URL = process.env.UPSTASH_REDIS_REST_URL;
          const REDIS_TOKEN = process.env.UPSTASH_REDIS_REST_TOKEN;

          function request(url, opts={}) {
            return new Promise((res) => {
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search,
                method: opts.method || 'GET',
                headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
              }, r => {
                let data = '';
                r.on('data', c => data += c);
                r.on('end', () => { try { res(JSON.parse(data)); } catch { res(null); } });
              });
              req.on('error', () => res(null));
              if (opts.body) req.write(opts.body);
              req.end();
            });
          }

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          function nowSec() { return Math.floor(Date.now()/1000); }
          function ago(s) { return nowSec() - s; }

          async function fetchCoinalyze(path, retries=3) {
            for (let i = 0; i < retries; i++) {
              const data = await request(`https://api.coinalyze.net/v1${path}`, {
                headers: { 'api_key': COINALYZE_KEY }
              });
              if (data && !data.message) return data;
              const wait = data?.message ? 62 : 10;
              console.log(`Retry ${i+1}: ${path.split('?')[0]} (${wait}s)`);
              await sleep(wait * 1000);
            }
            return null;
          }

          async function writeRedis(key, value, ttl=86400) {
            const body = JSON.stringify([['SET', key, JSON.stringify(value), 'EX', String(ttl)]]);
            const r = await request(`${REDIS_URL}/pipeline`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${REDIS_TOKEN}`, 'Content-Type': 'application/json' },
              body
            });
            console.log(`Redis ${key}:`, JSON.stringify(r));
          }

          // ---- Static fallback symbols (used only if dynamic discovery fails for an asset) ----
          const STATIC_ASSET_SYMBOLS = {
            BTC: ['BTCUSDT_PERP.A','BTCUSD_PERP.0','BTCUSDT_PERP.3','BTC-PERPETUAL.2','BTCUSDT_PERP.4','BTCPERP.6'],
            ETH: ['ETHUSDT_PERP.A','ETHUSD_PERP.0','ETHUSDT_PERP.3','ETH-PERPETUAL.2','ETHUSDT_PERP.4','ETHPERP.6'],
            SOL: ['SOLUSDT_PERP.A','SOLUSDT_PERP.3','SOLUSDT_PERP.4','SOLPERP.6'],
            XRP: ['XRPUSDT_PERP.A','XRPUSDT_PERP.3','XRPUSDT_PERP.4','XRPPERP.6'],
            HYPE: ['HYPEUSDT_PERP.A','HYPEUSDT_PERP.3','HYPEPERP.6','HYPE.H','HYPEUSDT_PERP.4'],
          };
          const TARGET_ASSETS = ['BTC','ETH','SOL','XRP','HYPE'];

          // ---- Dynamic per-asset symbol discovery ----
          // Replaces the static, hand-picked symbol lists with a live enumeration of
          // every perpetual market for each of our 5 tracked assets via /future-markets.
          // This keeps pace with new venue listings automatically instead of silently
          // drifting stale. Falls back PER-ASSET to the static list above if discovery
          // fails or an asset returns zero matches, so one bad asset can't break others.
          // NOTE: scoped to 5 assets only -- this is deliberately NOT the all-market
          // enumeration that previously caused a timeout; symbol counts here are small
          // (tens, not thousands).
          async function discoverAssetSymbols() {
            try {
              const markets = await fetchCoinalyze('/future-markets');
              if (!Array.isArray(markets) || !markets.length) {
                console.log('future-markets: no data, using static symbol lists for all assets');
                return { ...STATIC_ASSET_SYMBOLS };
              }
              const perps = markets.filter(m => {
                if (typeof m.is_perpetual === 'boolean') return m.is_perpetual;
                const s = (m.symbol || '').toUpperCase();
                return s.includes('PERP') || s.includes('-PERPETUAL');
              });
              const result = {};
              for (const asset of TARGET_ASSETS) {
                const syms = perps
                  .filter(m => (m.base_asset || m.baseAsset || '').toUpperCase() === asset)
                  .map(m => m.symbol)
                  .filter(Boolean);
                result[asset] = syms.length ? syms : STATIC_ASSET_SYMBOLS[asset];
                if (!syms.length) console.log(`  ${asset}: no dynamic matches, using static fallback (${STATIC_ASSET_SYMBOLS[asset].length} symbols)`);
              }
              return result;
            } catch (e) {
              console.log('discoverAssetSymbols failed, using static symbol lists for all assets:', e && e.message);
              return { ...STATIC_ASSET_SYMBOLS };
            }
          }

          function getAssetFromSymbol(symbol, assetSymbols) {
            for (const [asset, syms] of Object.entries(assetSymbols)) {
              if (syms.includes(symbol)) return asset;
            }
            return null;
          }

          // Pacing: each symbol in a multi-symbol request counts as one call against
          // Coinalyze's 40/min limit (confirmed: a 20-symbol request can consume the
          // entire per-minute budget in one call). Sleep between per-asset fetches is
          // scaled to that asset's symbol count so larger assets (more venues) get
          // proportionally more breathing room. fetchCoinalyze's built-in 62s backoff
          // on rate-limit responses remains the safety net if pacing estimate is off.
          function sleepForSymbolCount(n) {
            return Math.max(8000, n * 700);
          }

          async function fetchByAsset(assetSymbols, pathFn) {
            const results = [];
            await sleep(4000);
            for (const [asset, syms] of Object.entries(assetSymbols)) {
              console.log(`  Fetching ${asset}... (${syms.length} symbols)`);
              const data = await fetchCoinalyze(pathFn(syms.join(',')));
              if (data) results.push(...data);
              await sleep(sleepForSymbolCount(syms.length));
            }
            return results;
          }

          function aggregateOI(data, assetSymbols) {
            const byTime = {total:{}, BTC:{}, ETH:{}, SOL:{}, XRP:{}, HYPE:{}};
            for (const sym of (data||[])) {
              const asset = getAssetFromSymbol(sym.symbol||'', assetSymbols);
              for (const p of (sym.history||[])) {
                byTime.total[p.t] = (byTime.total[p.t]||0) + p.c;
                if (asset) byTime[asset][p.t] = (byTime[asset][p.t]||0) + p.c;
              }
            }
            const toArr = obj => Object.entries(obj).map(([t,v])=>({t:+t,v})).sort((a,b)=>a.t-b.t);
            return { total: toArr(byTime.total), BTC: toArr(byTime.BTC), ETH: toArr(byTime.ETH), SOL: toArr(byTime.SOL), XRP: toArr(byTime.XRP), HYPE: toArr(byTime.HYPE) };
          }

          function aggregateLiq(data, assetSymbols) {
            const byTime = {total:{}, BTC:{}, ETH:{}, SOL:{}, XRP:{}, HYPE:{}};
            for (const sym of (data||[])) {
              const asset = getAssetFromSymbol(sym.symbol||'', assetSymbols);
              for (const p of (sym.history||[])) {
                if (!byTime.total[p.t]) byTime.total[p.t] = {l:0,s:0};
                byTime.total[p.t].l += p.l||0;
                byTime.total[p.t].s += p.s||0;
                if (asset) {
                  if (!byTime[asset][p.t]) byTime[asset][p.t] = {l:0,s:0};
                  byTime[asset][p.t].l += p.l||0;
                  byTime[asset][p.t].s += p.s||0;
                }
              }
            }
            const toArr = obj => Object.entries(obj).map(([t,v])=>({t:+t,...v})).sort((a,b)=>a.t-b.t);
            return { total: toArr(byTime.total), BTC: toArr(byTime.BTC), ETH: toArr(byTime.ETH), SOL: toArr(byTime.SOL), XRP: toArr(byTime.XRP), HYPE: toArr(byTime.HYPE) };
          }

          function aggregateFund(data, assetSymbols) {
            const byTime = {total:{}, BTC:{}, ETH:{}, SOL:{}, XRP:{}, HYPE:{}};
            for (const sym of (data||[])) {
              const asset = getAssetFromSymbol(sym.symbol||'', assetSymbols);
              for (const p of (sym.history||[])) {
                if (!byTime.total[p.t]) byTime.total[p.t] = [];
                byTime.total[p.t].push(p.o);
                if (asset) {
                  if (!byTime[asset][p.t]) byTime[asset][p.t] = [];
                  byTime[asset][p.t].push(p.o);
                }
              }
            }
            const toArr = obj => Object.entries(obj)
              .map(([t,vals])=>({t:+t,v:vals.reduce((a,b)=>a+b,0)/vals.length}))
              .sort((a,b)=>a.t-b.t);
            return { total: toArr(byTime.total), BTC: toArr(byTime.BTC), ETH: toArr(byTime.ETH), SOL: toArr(byTime.SOL), XRP: toArr(byTime.XRP), HYPE: toArr(byTime.HYPE) };
          }

          function buildCharts(h24, h7d, h30d, h90d, h1y, aggregateFn, assetSymbols) {
            const a24  = aggregateFn(h24, assetSymbols);
            const a7d  = aggregateFn(h7d, assetSymbols);
            const a30d = aggregateFn(h30d, assetSymbols);
            const a90d = aggregateFn(h90d, assetSymbols);
            const a1y  = aggregateFn(h1y, assetSymbols);
            const result = {};
            for (const asset of ['total','BTC','ETH','SOL','XRP','HYPE']) {
              result[asset] = {
                '24h': a24[asset]  || [],
                '7d':  a7d[asset]  || [],
                '30d': a30d[asset] || [],
                '90d': a90d[asset] || [],
                '1y':  a1y[asset]  || [],
              };
            }
            return result;
          }

          async function main() {
            const from24h = ago(86400);
            const from7d  = ago(7*86400);
            const from30d = ago(30*86400);
            const from90d = ago(90*86400);
            const from1y  = ago(365*86400);
            const to = nowSec();

            console.log('=== Discovering per-asset symbols (live, falls back to static per-asset) ===');
            const ASSET_SYMBOLS = await discoverAssetSymbols();
            for (const [asset, syms] of Object.entries(ASSET_SYMBOLS)) {
              console.log(`  ${asset}: ${syms.length} symbols`);
            }
            const ALL_SYMBOLS = Object.values(ASSET_SYMBOLS).flat().join(',');
            await sleep(4000);

            console.log('=== Fetching current snapshots ===');
            const oiCurrent      = await fetchCoinalyze(`/open-interest?symbols=${ALL_SYMBOLS}&convert_to_usd=true`);
            await sleep(4000);
            const fundingCurrent = await fetchByAsset(ASSET_SYMBOLS, s => `/funding-rate?symbols=${s}`);
            await sleep(4000);

            console.log('=== Fetching 24H data (per asset) ===');
            const oiH24   = await fetchByAsset(ASSET_SYMBOLS, s => `/open-interest-history?symbols=${s}&interval=1hour&from=${from24h}&to=${to}&convert_to_usd=true`);
            const liqH24  = await fetchByAsset(ASSET_SYMBOLS, s => `/liquidation-history?symbols=${s}&interval=1hour&from=${from24h}&to=${to}&convert_to_usd=true`);
            const fundH24 = await fetchByAsset(ASSET_SYMBOLS, s => `/funding-rate-history?symbols=${s}&interval=1hour&from=${from24h}&to=${to}`);

            console.log('=== Fetching 7D data (per asset) ===');
            const oiH7d   = await fetchByAsset(ASSET_SYMBOLS, s => `/open-interest-history?symbols=${s}&interval=daily&from=${from7d}&to=${to}&convert_to_usd=true`);
            const liqH7d  = await fetchByAsset(ASSET_SYMBOLS, s => `/liquidation-history?symbols=${s}&interval=daily&from=${from7d}&to=${to}&convert_to_usd=true`);
            const fundH7d = await fetchByAsset(ASSET_SYMBOLS, s => `/funding-rate-history?symbols=${s}&interval=daily&from=${from7d}&to=${to}`);

            console.log('=== Fetching 30D data (per asset) ===');
            const oiH30d   = await fetchByAsset(ASSET_SYMBOLS, s => `/open-interest-history?symbols=${s}&interval=daily&from=${from30d}&to=${to}&convert_to_usd=true`);
            const liqH30d  = await fetchByAsset(ASSET_SYMBOLS, s => `/liquidation-history?symbols=${s}&interval=daily&from=${from30d}&to=${to}&convert_to_usd=true`);
            const fundH30d = await fetchByAsset(ASSET_SYMBOLS, s => `/funding-rate-history?symbols=${s}&interval=daily&from=${from30d}&to=${to}`);

            console.log('=== Fetching 90D data (per asset) ===');
            const oiH90d   = await fetchByAsset(ASSET_SYMBOLS, s => `/open-interest-history?symbols=${s}&interval=daily&from=${from90d}&to=${to}&convert_to_usd=true`);
            const liqH90d  = await fetchByAsset(ASSET_SYMBOLS, s => `/liquidation-history?symbols=${s}&interval=daily&from=${from90d}&to=${to}&convert_to_usd=true`);
            const fundH90d = await fetchByAsset(ASSET_SYMBOLS, s => `/funding-rate-history?symbols=${s}&interval=daily&from=${from90d}&to=${to}`);

            console.log('=== Fetching 1Y data (per asset) ===');
            const oiH1y   = await fetchByAsset(ASSET_SYMBOLS, s => `/open-interest-history?symbols=${s}&interval=daily&from=${from1y}&to=${to}&convert_to_usd=true`);
            const liqH1y  = await fetchByAsset(ASSET_SYMBOLS, s => `/liquidation-history?symbols=${s}&interval=daily&from=${from1y}&to=${to}&convert_to_usd=true`);
            const fundH1y = await fetchByAsset(ASSET_SYMBOLS, s => `/funding-rate-history?symbols=${s}&interval=daily&from=${from1y}&to=${to}`);

            console.log('=== Aggregating ===');
            const totalOI = (oiCurrent||[]).reduce((s,x)=>s+(x.value||0),0);
            const avgFunding = (fundingCurrent||[]).length
              ? (fundingCurrent||[]).reduce((s,f)=>s+(f.value||0),0)/(fundingCurrent||[]).length : 0;

            const fundingByAsset = { ALL: avgFunding };
            for (const [asset, syms] of Object.entries(ASSET_SYMBOLS)) {
              const rates = (fundingCurrent||[]).filter(f => syms.includes(f.symbol));
              fundingByAsset[asset] = rates.length
                ? rates.reduce((s,f)=>s+(f.value||0),0)/rates.length : 0;
            }

            const oiCharts   = buildCharts(oiH24,   oiH7d,   oiH30d,   oiH90d,   oiH1y,   aggregateOI,   ASSET_SYMBOLS);
            const liqCharts  = buildCharts(liqH24,  liqH7d,  liqH30d,  liqH90d,  liqH1y,  aggregateLiq,  ASSET_SYMBOLS);
            const fundCharts = buildCharts(fundH24, fundH7d, fundH30d, fundH90d, fundH1y, aggregateFund, ASSET_SYMBOLS);

            const totalChart24h     = oiCharts.total['24h'];
            const liqTotal24h       = liqCharts.total['24h'];
            const totalLiqs24h      = liqTotal24h.reduce((s,p)=>s+p.l+p.s,0);
            const totalLongLiqs24h  = liqTotal24h.reduce((s,p)=>s+p.l,0);
            const totalShortLiqs24h = liqTotal24h.reduce((s,p)=>s+p.s,0);
            const oiChange24h = totalChart24h.length>=2
              ? ((totalChart24h[totalChart24h.length-1].v - totalChart24h[0].v)/totalChart24h[0].v)*100 : 0;

            console.log('totalOI:', totalOI);
            console.log('totalLiqs24h:', totalLiqs24h);
            console.log('avgFunding:', avgFunding);
            console.log('fundingByAsset:', JSON.stringify(fundingByAsset));
            console.log('symbolCounts:', JSON.stringify(Object.fromEntries(Object.entries(ASSET_SYMBOLS).map(([k,v])=>[k,v.length]))));

            const result = {
              totalOI, oiChange24h, avgFunding, fundingByAsset,
              totalLiqs24h, totalLongLiqs24h, totalShortLiqs24h,
              totalVol24h: null,
              symbolCounts: Object.fromEntries(Object.entries(ASSET_SYMBOLS).map(([k,v])=>[k,v.length])),
              oiCharts, liqCharts, fundCharts,
              updatedAt: Date.now(),
            };

            await writeRedis('coinalyze:data', result, 86400);
            console.log('=== Done! ===');
          }

          main().catch(e => { console.error('Fatal:', e); process.exit(1); });
          EOF
