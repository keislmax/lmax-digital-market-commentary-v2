                r.on('end', () => { try { res(JSON.parse(data)); } catch { res(null); } });
              });
              req.on('error', () => res(null));
              if (opts.body) req.write(opts.body);
              req.end();
            });
          }
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          function chunk(arr, size) {
            const out = [];
            for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i+size));
            return out;
          }
          async function fetchCoinalyze(path, retries=3) {
            for (let i = 0; i < retries; i++) {
              const data = await request(`https://api.coinalyze.net/v1${path}`, { headers: { 'api_key': COINALYZE_KEY } });
              if (data && !data.message) return data;
              const wait = data?.message ? 62 : 10;
              console.log(`Retry ${i+1}: ${path.split('?')[0]} (${wait}s)`);
              await sleep(wait * 1000);
            }
            return null;
          }
          async function writeRedis(key, value, ttl=7200) {
            const body = JSON.stringify([['SET', key, JSON.stringify(value), 'EX', String(ttl)]]);
            const r = await request(`${REDIS_URL}/pipeline`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${REDIS_TOKEN}`, 'Content-Type': 'application/json' },
              body
            });
            console.log('Redis:', JSON.stringify(r));
          }
          async function main() {
            const from24h = Math.floor(Date.now()/1000) - 86400;
            const to = Math.floor(Date.now()/1000);
            const markets = await fetchCoinalyze('/future-markets');
            const allSymbols = markets.map(m => m.symbol);
            const chunks = chunk(allSymbols, 200);
            const results = [];
            for (let i = 0; i < chunks.length; i++) {
              const data = await fetchCoinalyze(`/liquidation-history?symbols=${chunks[i].join(',')}&interval=1hour&from=${from24h}&to=${to}&convert_to_usd=true`);
              if (Array.isArray(data)) results.push(...data);
              if (i < chunks.length-1) await sleep(1600);
              if (i % 5 === 4) console.log(`${i+1}/${chunks.length} chunks`);
            }
            const byTime = {};
            for (const sym of results) {
              for (const p of (sym.history||[])) {
                if (!byTime[p.t]) byTime[p.t] = {l:0,s:0};
                byTime[p.t].l += p.l||0;
                byTime[p.t].s += p.s||0;
              }
            }
            const liqChart = Object.entries(byTime).map(([t,v])=>({t:+t,...v})).sort((a,b)=>a.t-b.t);
            const totalLiqs = liqChart.reduce((s,p)=>s+p.l+p.s, 0);
            const totalLongLiqs = liqChart.reduce((s,p)=>s+p.l, 0);
            const totalShortLiqs = liqChart.reduce((s,p)=>s+p.s, 0);
            console.log('totalLiqs:', totalLiqs);
            await writeRedis('coinalyze:liqs', { totalLiqs, totalLongLiqs, totalShortLiqs, liqChart }, 7200);
          }
          main().catch(e => { console.error(e); process.exit(1); });
          EOF

