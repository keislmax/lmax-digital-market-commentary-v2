name: Fetch Market Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch and cache market data
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');
          const COINALYZE_KEY = process.env.COINALYZE_API_KEY;
          const REDIS_URL = process.env.UPSTASH_REDIS_REST_URL;
          const REDIS_TOKEN = process.env.UPSTASH_REDIS_REST_TOKEN;

          function request(url, opts={}) {
            return new Promise((res) => {
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search,
                method: opts.method || 'GET',
                headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
              }, r => {
                let data = '';
                r.on('data', c => data += c);
                r.on('end', () => { try { res(JSON.parse(data)); } catch { res(null); } });
              });
              req.on('error', e => { console.log('Request error:', e.message); res(null); });
              if (opts.body) req.write(opts.body);
              req.end();
            });
          }

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          function chunk(arr, size) {
            const out = [];
            for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i+size));
            return out;
          }
          function nowSec() { return Math.floor(Date.now()/1000); }

          async function fetchCoinalyze(path, retries=3) {
            for (let i = 0; i < retries; i++) {
              const data = await request(`https://api.coinalyze.net/v1${path}`, {
                headers: { 'api_key': COINALYZE_KEY }
              });
              if (data && !data.message) return data;
              const wait = data?.message ? 62 : 10;
              console.log(`  Retry ${i+1}: ${path.split('?')[0]} (waiting ${wait}s)`);
              await sleep(wait * 1000);
            }
            console.log(`  Failed: ${path.split('?')[0]}`);
            return null;
          }

          async function fetchEndpointAllChunks(endpoint, chunks, extraParams) {
            const results = [];
            for (let i = 0; i < chunks.length; i++) {
              const data = await fetchCoinalyze(`/${endpoint}?symbols=${chunks[i].join(',')}&${extraParams}`);
              if (Array.isArray(data)) results.push(...data);
              if (i < chunks.length-1) await sleep(1600);
              if (i % 5 === 4) console.log(`  ${i+1}/${chunks.length} chunks done`);
            }
            return results;
          }

          async function writeRedis(key, value, ttl=86400) {
            const valueStr = JSON.stringify(value);
            console.log(`Writing ${key}: ${valueStr.length} bytes`);
            const body = JSON.stringify([['SET', key, valueStr, 'EX', String(ttl)]]);
            const r = await request(`${REDIS_URL}/pipeline`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${REDIS_TOKEN}`, 'Content-Type': 'application/json' },
              body
            });
            console.log('Redis result:', JSON.stringify(r));
          }

          async function main() {
            const from24h = nowSec() - 86400;
            const to = nowSec();

            // Step 1: Get all symbols
            console.log('\n=== Fetching symbol list ===');
            const markets = await fetchCoinalyze('/future-markets');
            if (!Array.isArray(markets)) { console.error('Failed to fetch markets'); process.exit(1); }
            const allSymbols = markets.map(m => m.symbol);
            console.log(`Total symbols: ${allSymbols.length}`);
            const chunks = chunk(allSymbols, 200);
            console.log(`Total chunks per endpoint: ${chunks.length}`);
            await sleep(2000);

            // Step 2: OI current
            console.log('\n=== Fetching OI (current) ===');
            const oiCurrent = await fetchEndpointAllChunks('open-interest', chunks, 'convert_to_usd=true');
            const totalOI = oiCurrent.reduce((s,x) => s+(x.value||0), 0);
            console.log(`totalOI: ${totalOI}`);
            await sleep(3000);

            // Step 3: OI history
            console.log('\n=== Fetching OI history ===');
            const oiHistory = await fetchEndpointAllChunks('open-interest-history', chunks, `interval=1hour&from=${from24h}&to=${to}&convert_to_usd=true`);
            const oiByTime = {};
            for (const sym of oiHistory) {
              for (const p of (sym.history||[])) { oiByTime[p.t] = (oiByTime[p.t]||0) + p.c; }
            }
            const oiChart = Object.entries(oiByTime).map(([t,v])=>({t:+t,v})).sort((a,b)=>a.t-b.t);
            const oiChange24h = oiChart.length>=2 ? ((oiChart[oiChart.length-1].v - oiChart[0].v) / oiChart[0].v)*100 : 0;
            console.log(`oiChart points: ${oiChart.length}, change24h: ${oiChange24h}`);
            await sleep(3000);

            // Step 4: Liquidations
            console.log('\n=== Fetching liquidations ===');
            const liqHistory = await fetchEndpointAllChunks('liquidation-history', chunks, `interval=1hour&from=${from24h}&to=${to}&convert_to_usd=true`);
            const liqByTime = {};
            for (const sym of liqHistory) {
              for (const p of (sym.history||[])) {
                if (!liqByTime[p.t]) liqByTime[p.t] = {l:0,s:0};
                liqByTime[p.t].l += p.l||0;
                liqByTime[p.t].s += p.s||0;
              }
            }
            const liqChart = Object.entries(liqByTime).map(([t,v])=>({t:+t,...v})).sort((a,b)=>a.t-b.t);
            const totalLiqs = liqChart.reduce((s,p)=>s+p.l+p.s, 0);
            const totalLongLiqs = liqChart.reduce((s,p)=>s+p.l, 0);
            const totalShortLiqs = liqChart.reduce((s,p)=>s+p.s, 0);
            console.log(`totalLiqs: ${totalLiqs}`);
            await sleep(3000);

            // Step 5: Volume
            console.log('\n=== Fetching volume ===');
            const volHistory = await fetchEndpointAllChunks('ohlcv-history', chunks, `interval=1hour&from=${from24h}&to=${to}`);
            let totalVolume = 0;
            for (const sym of volHistory) {
              for (const p of (sym.history||[])) { totalVolume += (p.v||0) * (p.c||0); }
            }
            console.log(`totalVolume: ${totalVolume}`);
            await sleep(3000);

            // Step 6: Funding rates (BTC/ETH/SOL/XRP only)
            console.log('\n=== Fetching funding rates ===');
            const FUNDING_SYMBOLS = [
              'BTCUSDT_PERP.A','BTCUSD_PERP.0','BTCUSDT_PERP.3','BTC-PERPETUAL.2','BTCUSDT_PERP.4','BTCPERP.6',
              'ETHUSDT_PERP.A','ETHUSD_PERP.0','ETHUSDT_PERP.3','ETH-PERPETUAL.2','ETHUSDT_PERP.4','ETHPERP.6',
              'SOLUSDT_PERP.A','SOLUSDT_PERP.3','SOLUSDT_PERP.4','SOLPERP.6',
              'XRPUSDT_PERP.A','XRPUSDT_PERP.3','XRPUSDT_PERP.4','XRPPERP.6',
            ].join(',');
            const fundingCurrent = await fetchCoinalyze(`/funding-rate?symbols=${FUNDING_SYMBOLS}`);
            await sleep(2000);
            const fundingHistory = await fetchCoinalyze(`/funding-rate-history?symbols=${FUNDING_SYMBOLS}&interval=1hour&from=${from24h}&to=${to}`);
            const avgFunding = Array.isArray(fundingCurrent) && fundingCurrent.length
              ? fundingCurrent.reduce((s,f)=>s+(f.last_funding_rate||0),0)/fundingCurrent.length : 0;
            const fundByTime = {};
            for (const sym of (fundingHistory||[])) {
              for (const p of (sym.history||[])) {
                if (!fundByTime[p.t]) fundByTime[p.t] = [];
                fundByTime[p.t].push(p.o);
              }
            }
            const fundChart = Object.entries(fundByTime)
              .map(([t,vals])=>({t:+t,v:vals.reduce((a,b)=>a+b,0)/vals.length}))
              .sort((a,b)=>a.t-b.t);
            console.log(`avgFunding: ${avgFunding}, chart points: ${fundChart.length}`);

            // Step 7: Write final result to Redis
            console.log('\n=== Writing to Redis ===');
            const result = {
              totalOI, oiChange24h, oiChart,
              totalLiqs, totalLongLiqs, totalShortLiqs, liqChart,
              totalVolume,
              avgFunding, fundChart,
              updatedAt: Date.now(),
            };
            await writeRedis('coinalyze:data', result, 86400);
            console.log('\n=== Done! ===');
          }

          main().catch(e => { console.error('Fatal:', e); process.exit(1); });
          EOF
