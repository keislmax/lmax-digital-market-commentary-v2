name: Test Coinalyze Exchanges

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch all asset perpetual symbols
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: |
          node << 'EOF'
          const https = require('https');
          const COINALYZE_KEY = process.env.COINALYZE_API_KEY;

          function get(path) {
            return new Promise((resolve) => {
              const url = new URL(`https://api.coinalyze.net/v1${path}`);
              const req = https.request({
                hostname: url.hostname,
                path: url.pathname + url.search,
                headers: { 'api_key': COINALYZE_KEY },
              }, r => {
                let data = '';
                r.on('data', c => data += c);
                r.on('end', () => { try { resolve(JSON.parse(data)); } catch { resolve(null); } });
              });
              req.on('error', () => resolve(null));
              req.end();
            });
          }

          async function main() {
            const markets = await get('/future-markets');
            if (!Array.isArray(markets)) {
              console.log('future-markets failed:', JSON.stringify(markets));
              return;
            }

            const TARGET_ASSETS = ['BTC','ETH','SOL','XRP','HYPE'];
            for (const asset of TARGET_ASSETS) {
              const perps = markets.filter(m => {
                const base = (m.base_asset || m.baseAsset || '').toUpperCase();
                const isPerp = typeof m.is_perpetual === 'boolean'
                  ? m.is_perpetual
                  : (m.symbol||'').toUpperCase().includes('PERP') || (m.symbol||'').toUpperCase().includes('-PERPETUAL');
                return base === asset && isPerp;
              });
              console.log(`\n=== ${asset} perpetuals (${perps.length}) ===`);
              perps.forEach(m => console.log(`  ${m.symbol.padEnd(32)} exchange=${m.exchange || '?'}`));
            }
          }

          main().catch(e => { console.error('Fatal:', e); process.exit(1); });
          EOF
