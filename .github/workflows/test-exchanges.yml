name: Test Coinalyze Exchanges

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch exchange codes and BTC symbols
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: |
          node << 'EOF'
          const https = require('https');
          const COINALYZE_KEY = process.env.COINALYZE_API_KEY;

          function get(path) {
            return new Promise((resolve) => {
              const url = new URL(`https://api.coinalyze.net/v1${path}`);
              const req = https.request({
                hostname: url.hostname,
                path: url.pathname + url.search,
                headers: { 'api_key': COINALYZE_KEY },
              }, r => {
                let data = '';
                r.on('data', c => data += c);
                r.on('end', () => { try { resolve(JSON.parse(data)); } catch { resolve(null); } });
              });
              req.on('error', () => resolve(null));
              req.end();
            });
          }

          async function main() {
            // Step 1: get all exchange codes + names
            console.log('=== /exchanges ===');
            const exchanges = await get('/exchanges');
            if (Array.isArray(exchanges)) {
              exchanges.forEach(e => console.log(`  code=${JSON.stringify(e.code)} name=${JSON.stringify(e.name)}`));
            } else {
              console.log('exchanges response:', JSON.stringify(exchanges));
            }

            // Step 2: get all BTC perpetuals to see which exchange suffixes exist
            // and what the full symbol looks like per exchange
            console.log('\n=== BTC perpetuals from /future-markets ===');
            const markets = await get('/future-markets');
            if (Array.isArray(markets)) {
              const btcPerps = markets.filter(m => {
                const base = (m.base_asset || m.baseAsset || '').toUpperCase();
                const isPerp = typeof m.is_perpetual === 'boolean'
                  ? m.is_perpetual
                  : (m.symbol||'').toUpperCase().includes('PERP') || (m.symbol||'').toUpperCase().includes('-PERPETUAL');
                return base === 'BTC' && isPerp;
              });
              btcPerps.forEach(m => console.log(`  symbol=${m.symbol}  exchange=${m.exchange || m.exchange_code || '?'}`));
              console.log(`\nTotal BTC perps: ${btcPerps.length}`);

              // Also log ETH, SOL, XRP, HYPE counts
              for (const asset of ['ETH','SOL','XRP','HYPE']) {
                const count = markets.filter(m => {
                  const base = (m.base_asset || m.baseAsset || '').toUpperCase();
                  const isPerp = typeof m.is_perpetual === 'boolean'
                    ? m.is_perpetual
                    : (m.symbol||'').toUpperCase().includes('PERP') || (m.symbol||'').toUpperCase().includes('-PERPETUAL');
                  return base === asset && isPerp;
                }).length;
                console.log(`${asset} perps: ${count}`);
              }
            } else {
              console.log('future-markets response:', JSON.stringify(markets)?.slice(0, 200));
            }
          }

          main().catch(e => { console.error('Fatal:', e); process.exit(1); });
          EOF
