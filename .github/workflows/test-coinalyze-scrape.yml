name: Test Coinalyze Scrape

on:
  workflow_dispatch:

jobs:
  test-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Attempt fetch and parse
        run: |
          node << 'EOF'
          const https = require('https');

          function fetchPage(url) {
            return new Promise((resolve, reject) => {
              const req = https.request(url, {
                method: 'GET',
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
                  'Sec-Fetch-Dest': 'document',
                  'Sec-Fetch-Mode': 'navigate',
                  'Sec-Fetch-Site': 'none',
                  'Upgrade-Insecure-Requests': '1',
                },
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => resolve({ status: res.statusCode, headers: res.headers, body: data }));
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            const url = 'https://coinalyze.net/category-all/open-interest/';
            console.log('Requesting:', url);
            const res = await fetchPage(url);

            console.log('--- HTTP status:', res.status, '---');
            console.log('--- content-length:', res.body.length, 'bytes ---');
            console.log('--- server header:', res.headers['server'] || '(none)', '---');
            console.log('--- cf-ray header:', res.headers['cf-ray'] || '(none, no Cloudflare ray seen)', '---');

            if (res.status !== 200) {
              console.log('--- NOT 200. First 500 chars of body: ---');
              console.log(res.body.slice(0, 500));
              console.log('--- RESULT: BLOCKED ---');
              return;
            }

            // Look for the "Open Interest:" label followed by a value, as seen in
            // the page's server-rendered HTML (e.g. <span>Open Interest:</span><span>$42.7b</span>)
            const oiMatch = res.body.match(/Open Interest:<\/span><span[^>]*>\$?([\d.,]+[bmk]?)<\/span>/i);
            const liqMatch = res.body.match(/Liquidations 24H:<\/span><span[^>]*>\$?([\d.,]+[bmk]?)<\/span>/i);

            console.log('--- Open Interest match:', oiMatch ? oiMatch[1] : 'NOT FOUND', '---');
            console.log('--- Liquidations 24H match:', liqMatch ? liqMatch[1] : 'NOT FOUND', '---');

            if (oiMatch) {
              console.log('--- RESULT: SUCCESS, scraping is viable from this runner ---');
            } else {
              console.log('--- RESULT: 200 OK but pattern not found; page structure may differ from expected, dumping a snippet ---');
              const idx = res.body.indexOf('Open Interest');
              console.log(idx >= 0 ? res.body.slice(Math.max(0, idx - 100), idx + 300) : '"Open Interest" text not found anywhere in body');
            }
          }

          main().catch(e => { console.error('Fatal:', e); process.exit(1); });
          EOF
