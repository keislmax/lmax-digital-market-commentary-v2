name: Test Cron Schedule

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Log trigger time
        run: |
          echo "Triggered at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled cron: ${{ github.event.schedule }}"
